<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>星辰旅人论坛 · 登录状态桥接</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f6f7f9; color: #1f2328;
    }
    @media (prefers-color-scheme: dark) { body { background: #16181d; color: #e6e8eb; } }
    main { text-align: center; padding: 24px; }
    .logo { width: 56px; height: 56px; border-radius: 12px; display: block; margin: 0 auto; }
    h1 { font-size: 16px; margin: 10px 0 6px; }
    p { font-size: 13px; opacity: .75; margin: 4px 0; }
    .spin {
      display: inline-block; width: 18px; height: 18px; margin-bottom: 10px;
      border: 2px solid rgba(127,127,127,.35); border-top-color: #4c8dff; border-radius: 50%;
      animation: r .8s linear infinite;
    }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/icon-192.png" alt="星辰旅人论坛" width="56" height="56">
    <h1>星辰旅人论坛 · 登录状态桥接</h1>
    <p><span class="spin"></span></p>
    <p id="status">正在读取论坛登录状态…</p>
  </main>
  <script>
    (function () {
      'use strict';
      // 允许同步登录状态的站点白名单：运行时从 /api/auth/site-login/origins 拉取
      // （管理后台 /admin/sso 维护，改配置无需重新部署）；拉取失败时用内置兜底。
      var FALLBACK_ORIGINS = [
        'https://zako.mom',
        'http://127.0.0.1:8788',
        'http://localhost:8788'
      ];
      var REMOTE_CONFIG = null;
      var ACCESS_KEY = 'starlr.access';
      var REFRESH_KEY = 'starlr.refresh';
      var statusEl = document.getElementById('status');
      var spinner = document.querySelector('.spin');

      function setStatus(text) {
        if (statusEl) statusEl.textContent = text;
        if (spinner && text) spinner.style.display = 'none';
      }

      function bearerGet(path, token) {
        return fetch(path, { headers: { Authorization: 'Bearer ' + token } })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
      }

      /** 读取本域（论坛第一方上下文）登录态：me → 失效则同源续期并写回 → 再取资料 */
      function collectSession() {
        var access = localStorage.getItem(ACCESS_KEY) || '';
        var refresh = localStorage.getItem(REFRESH_KEY) || '';
        if (!access && !refresh) {
          return Promise.resolve(null);
        }
        var me = access ? bearerGet('/api/auth/me', access) : Promise.resolve(null);
        return me.then(function (res) {
          if (res && res.user) return { user: res.user, access: access, refresh: refresh || null };
          if (!refresh) return null;
          return fetch('/api/auth/refresh', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ refreshToken: refresh })
          })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; })
            .then(function (tokens) {
              if (!tokens || !tokens.accessToken) return null;
              localStorage.setItem(ACCESS_KEY, tokens.accessToken);
              if (tokens.refreshToken) localStorage.setItem(REFRESH_KEY, tokens.refreshToken);
              return bearerGet('/api/auth/me', tokens.accessToken).then(function (me2) {
                if (!me2 || !me2.user) return null;
                return { user: me2.user, access: tokens.accessToken, refresh: tokens.refreshToken || null };
              });
            });
        });
      }

      function back(url, params) {
        var target = url + '#' + params;
        setStatus('正在返回…');
        window.location.replace(target);
      }

      function fail(returnUrl, message) {
        setStatus(message);
        setTimeout(function () {
          back(returnUrl, 'sso=error&reason=' + encodeURIComponent(message));
        }, 1200);
      }

      function allowedOrigins() {
        if (REMOTE_CONFIG && Array.isArray(REMOTE_CONFIG.origins) && REMOTE_CONFIG.origins.length) {
          return REMOTE_CONFIG.origins.map(function (o) { return String(o).replace(/\/+$/, ''); });
        }
        return FALLBACK_ORIGINS;
      }

      function run() {
        var qs = new URLSearchParams(window.location.search);
        var redirect = qs.get('redirect') || '';
        var challenge = qs.get('challenge') || '';
        var origin = '';
        try { origin = new URL(redirect).origin.replace(/\/+$/, ''); } catch (e) { origin = ''; }

        if (REMOTE_CONFIG && REMOTE_CONFIG.enabled === false) {
          setStatus('论坛登录同步功能当前已关闭（可关闭本页）');
          return;
        }
        if (!redirect || allowedOrigins().indexOf(origin) === -1 || !challenge) {
          setStatus('缺少合法的回跳地址或校验参数（可关闭本页）');
          return;
        }

        collectSession().then(function (session) {
          if (!session) {
            back(redirect, 'sso=none');
            return;
          }
          setStatus('已找到论坛登录状态：@' + (session.user.username || '?') + '，正在签发一次性凭证…');
          return fetch('/api/auth/site-login/issue', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access },
            body: JSON.stringify({ origin: origin, challenge: challenge })
          })
            .then(function (r) { return r.ok ? r.json() : r.json().catch(function () { return null; }).then(function (b) { return Promise.reject(new Error((b && b.error && b.error.message) || '签发失败')); }); })
            .then(function (data) {
              if (!data || !data.ticket) throw new Error('签发失败');
              back(redirect, 'sso_ticket=' + encodeURIComponent(data.ticket) + '&sso_challenge=' + encodeURIComponent(challenge));
            })
            .catch(function (e) {
              fail(redirect, '登录同步失败：' + (e && e.message ? e.message : '未知原因'));
            });
        });
      }

      // 先拉取动态白名单（60s 可缓存），失败不阻塞：用兜底列表继续
      (function () {
        var started = false;
        var timer = setTimeout(function () { if (!started) { started = true; run(); } }, 1500);
        fetch('/api/auth/site-login/origins')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            REMOTE_CONFIG = d && typeof d === 'object' ? d : null;
            clearTimeout(timer);
            if (!started) { started = true; run(); }
          })
          .catch(function () {
            clearTimeout(timer);
            if (!started) { started = true; run(); }
          });
      })();
    })();
  </script>
</body>
</html>
