<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安全验证</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #0f1419;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  #box { text-align: center; padding: 16px; }
  #msg { margin-top: 12px; font-size: 13px; color: #536471; }
  .err { color: #f4212e; }
</style>
</head>
<body>
<div id="box">
  <div id="cf-widget"></div>
  <div id="msg">正在加载安全验证…</div>
</div>
<script>
(function () {
  var sent = false;
  function emit(token) {
    if (sent) return;
    sent = true;
    window.StarlrAndroid.onToken(token);
  }
  function fail(message) {
    var el = document.getElementById('msg');
    el.textContent = message;
    el.className = 'err';
    window.StarlrAndroid.onError(message);
  }
  window.onTurnstileReady = function () {
    fetch('/api/config', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (cfg) {
        if (!cfg.turnstileSiteKey) { fail('站点未启用人机验证'); return; }
        document.getElementById('msg').textContent = '正在校验环境…';
        turnstile.render('#cf-widget', {
          sitekey: cfg.turnstileSiteKey,
          size: 'normal',
          callback: emit,
          'error-callback': function (code) { fail('验证组件加载失败' + (code ? '（' + code + '）' : '')); },
          'timeout-callback': function () { fail('验证超时，请重试'); },
          'expired-callback': function () { fail('验证已过期，请重试'); },
        });
      })
      .catch(function (e) { fail('验证配置加载失败：' + (e && e.message ? e.message : e)); });
  };
})();
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileReady&render=explicit" async defer></script>
</body>
</html>
